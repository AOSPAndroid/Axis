name: Mirror models

on:
  push:
    branches: [claude/local-agent]
    paths: ['.github/workflows/model-mirror.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    name: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - tag: qwen3.8-flash-next-gsq-rco-q2-0
            title: Qwen3.8-Flash-Next GSQ-RCO Q2_0 (125B, 6B active, 66.4 GB)
            hf_repo: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
            hf_rev: ed59f92082b1e93c0e96d60a8b11aab089b52f09
            file: >-
              Q2_0/Qwen3.8-Flash-Next-GSQ-RCO-Q2_0-00001-of-00002.gguf
              Q2_0/Qwen3.8-Flash-Next-GSQ-RCO-Q2_0-00002-of-00002.gguf
            size: '37623740192 28800138432'
            sha256: >-
              69820c02ec7d0b45ef2ebb19d6620299db749fe2aded7f39f93c6b88b199b720
              316b46f3a2dbd68c900f43136ab9449f9dcc3725dfd8c794847c204bc161e113
            license: Qwen Community License 1.0
            license_file: LICENSE-QWEN-COMMUNITY-1.0.txt
            license_url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next/resolve/de4b8e4d43b917e7706784d8bb445c9af86a3540/LICENSE
            about: >-
              Official Qwen3.8-Flash-Next (August 2026): 125B parameters with 6B active per token,
              plus a 51B n-gram table. Quantized by IST Austria (DASLab) with GSQ-RCO to about
              2.4 bits per weight. Two files; llama.cpp loads the second from the folder of the
              first. The second file is the n-gram table, which can stay on disk
              (--load-mode mmap --lazy-mode on). Needs llama.cpp with the qwen4exp architecture.
          - tag: k2-horizon-mova-36b-a4b-q4-k-m
            title: K2-Horizon-MoVA-36B-A4B Q4_K_M (thinks before answering, 22.4 GB)
            hf_repo: IFM/K2-Horizon-MoVA-36B-A4B-GGUF
            hf_rev: 00cce3151bdce384661cb33603853ccfe6209de9
            file: K2-Horizon-MoVA-36B-A4B-Q4_K_M.gguf
            size: '22368011616'
            sha256: 513dd78590ac29135a7cea5a99865d57d65291b1f857a8904fb9b1878d4f4cbd
            about: >-
              K2-Horizon-MoVA-36B-A4B (September 2026), quantized by its makers, IFM. Mixture of
              experts, about 4B active per token. It reasons before every answer. Needs llama.cpp
              b11454 or newer.
          - tag: qwen3.8-27b-q4-k-m
            title: Qwen3.8-27B Q4_K_M (best at terminal tasks, 16.5 GB)
            hf_repo: unsloth/Qwen3.8-27B-GGUF
            hf_rev: 4ca720788d1e01f1bff70c033e0d0028fd02e502
            file: Qwen3.8-27B-UD-Q4_K_M.gguf
            size: '16464440224'
            sha256: 322e194ff79741c7baa497c240f677f54b201b0efab44ca8e50f122b39123482
            about: >-
              Official Qwen3.8-27B (August 2026), quantized by Unsloth. Dense model: strongest
              at terminal and coding tasks in this list, but slow on a processor.
          - tag: gemma-4-26b-a4b-qat-q4-0
            title: Gemma 4 26B-A4B QAT Q4_0 (Google, 14.4 GB)
            hf_repo: google/gemma-4-26B-A4B-it-qat-q4_0-gguf
            hf_rev: d1c082be9cf3c8a514acf63b8761f4b41935842e
            file: gemma-4-26B_q4_0-it.gguf
            size: '14439363584'
            sha256: 3eca3b8f6d7baf218a7dd6bba5fb59a56ee25fe2d567b6f5f589b4f697eca51d
            about: Google's own quantization-aware-trained Q4_0 build. Mixture of experts, about 4B active per token.
          - tag: qwen3.6-35b-a3b-q4-k-m
            title: Qwen3.6-35B-A3B Q4_K_M (CPU, 32 GB+ RAM)
            hf_repo: unsloth/Qwen3.6-35B-A3B-GGUF
            hf_rev: a483e9e6cbd595906af30beda3187c2663a1118c
            file: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
            size: '22134528992'
            sha256: ac0e2c1189e055faa36eff361580e79c5bd6f8e76bffb4ce547f167d53e31a61
            about: Official Qwen3.6-35B-A3B, quantized by Unsloth. Mixture of experts, about 3B active per token.
          - tag: qwen3.6-35b-a3b-abliterated-q4-k-m
            title: Qwen3.6-35B-A3B abliterated Q4_K_M (21.2 GB)
            hf_repo: mradermacher/Huihui-Qwen3.6-35B-A3B-abliterated-GGUF
            hf_rev: 0693fc2b47f66380f4b568b01e05195d22edd3a2
            file: Huihui-Qwen3.6-35B-A3B-abliterated.Q4_K_M.gguf
            size: '21166758784'
            sha256: fbaa4eb3e2365abffd495c5efa7df88c2b2a5088ba32cd2895973d130991e92b
            about: >-
              Community model. huihui-ai removed refusal behaviour from Qwen3.6-35B-A3B
              (abliteration); quantized by mradermacher. Not an official Qwen release; it may be
              less reliable than the original and will not decline harmful requests.
          - tag: qwen3.5-9b-abliterated-q4-k-m
            title: Qwen3.5-9B abliterated Q4_K_M (5.6 GB)
            hf_repo: mradermacher/Huihui-Qwen3.5-9B-abliterated-GGUF
            hf_rev: 9f646d7eda193ddf2348134f3bff3d49eed7a2c6
            file: Huihui-Qwen3.5-9B-abliterated.Q4_K_M.gguf
            size: '5627045248'
            sha256: ea1858ef4dc4b648b8dbb44612962a0333e945060dd0545ac0f28d7c4416e4b3
            about: >-
              Community model. huihui-ai removed refusal behaviour from Qwen3.5-9B
              (abliteration); quantized by mradermacher. Not an official Qwen release; it may be
              less reliable than the original and will not decline harmful requests.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ matrix.tag }}
      TITLE: ${{ matrix.title }}
      # Space-separated when a model comes in several files: their paths in the repo, sizes and SHA-256.
      MODEL: ${{ matrix.file }}
      MODEL_SIZE: ${{ matrix.size }}
      MODEL_SHA256: ${{ matrix.sha256 }}
      HF_REPO: ${{ matrix.hf_repo }}
      HF_REV: ${{ matrix.hf_rev }}
      ABOUT: ${{ matrix.about }}
      LICENSE_NAME: ${{ matrix.license || 'Apache-2.0' }}
      LICENSE_FILE: ${{ matrix.license_file || 'LICENSE-APACHE-2.0.txt' }}
      LICENSE_URL: ${{ matrix.license_url || 'https://www.apache.org/licenses/LICENSE-2.0.txt' }}
      PART_SIZE: '1900000000'
    steps:
      - name: Skip if already published
        id: check
        shell: bash
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null | grep -qx false; then
            echo "Release $TAG is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - name: Create draft release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" > /dev/null 2>&1; then break; fi
            # Tag main's head: it is already on the default branch.
            if gh release create "$TAG" --target main --draft --latest=false \
                 --title "$TITLE" --notes "Uploading; not ready yet."; then break; fi
            echo "Creating the release failed (attempt $attempt); response headers:"
            GH_DEBUG=api gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f target_commitish=main \
              -F draft=true -f name="$TITLE" 2>&1 | grep -iE '^< (HTTP|x-accepted|x-github-sso|x-ratelimit-remaining|retry-after)|message' || true
            sleep 60
          done
          gh release view "$TAG" > /dev/null

      - name: Download, verify and upload one part at a time
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts assets
          : > assets/PARTS-SHA256SUMS.txt
          : > assets/MODEL-SHA256SUM.txt
          read -ra paths <<< "$MODEL"
          read -ra sizes <<< "$MODEL_SIZE"
          read -ra digests <<< "$MODEL_SHA256"
          for f in "${!paths[@]}"; do
            name=$(basename "${paths[$f]}")
            size=${sizes[$f]}
            url="https://huggingface.co/$HF_REPO/resolve/$HF_REV/${paths[$f]}"
            count=$(( (size + PART_SIZE - 1) / PART_SIZE ))
            # Each part is hashed as it passes, so only one part is on disk at a time.
            rm -f hash.fifo
            mkfifo hash.fifo
            sha256sum < hash.fifo > whole.sha &
            hasher=$!
            exec 3> hash.fifo
            for i in $(seq 1 "$count"); do
              start=$(( (i - 1) * PART_SIZE ))
              end=$(( i * PART_SIZE - 1 ))
              if [ "$end" -ge "$size" ]; then end=$(( size - 1 )); fi
              want=$(( end - start + 1 ))
              part=$(printf '%s.part%03d' "$name" "$i")
              for attempt in 1 2 3 4 5; do
                if curl --fail --location --silent --show-error --connect-timeout 30 --retry 3 --retry-all-errors \
                     --range "$start-$end" --output "parts/$part" "$url" && [ "$(stat -c %s "parts/$part")" -eq "$want" ]; then
                  break
                fi
                echo "Part $i attempt $attempt failed; retrying."
                sleep 15
              done
              test "$(stat -c %s "parts/$part")" -eq "$want"
              cat "parts/$part" >&3
              (cd parts && sha256sum "$part") >> assets/PARTS-SHA256SUMS.txt
              for attempt in 1 2 3 4 5; do
                if gh release upload "$TAG" "parts/$part" --clobber; then break; fi
                if [ "$attempt" -eq 5 ]; then exit 1; fi
                echo "Uploading part $i failed (attempt $attempt); retrying."
                sleep 30
              done
              rm "parts/$part"
              echo "$name part $i of $count: $want bytes"
            done
            exec 3>&-
            wait "$hasher"
            actual=$(cut -d' ' -f1 whole.sha)
            echo "SHA-256 of $name: $actual"
            test "$actual" = "${digests[$f]}"
            printf '%s  %s\n' "$actual" "$name" >> assets/MODEL-SHA256SUM.txt
          done
          cat assets/PARTS-SHA256SUMS.txt

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://huggingface.co/$HF_REPO/resolve/$HF_REV/README.md" -o assets/UPSTREAM-MODEL-CARD.md
          curl --fail --location --silent --show-error "$LICENSE_URL" -o "assets/$LICENSE_FILE"
          total=$(wc -l < assets/PARTS-SHA256SUMS.txt)
          cat > assets/README.txt <<EOF
          $TITLE

          $ABOUT
          License: $LICENSE_NAME (attached).
          Source: https://huggingface.co/$HF_REPO
          Revision: $HF_REV
          Weights mirrored without modification; split for transport.

          SHA-256 of the original files:
          $(cat assets/MODEL-SHA256SUM.txt)

          Download ALL $total .part files into Downloads. They are raw byte chunks,
          not loadable on their own. Axis's start.py finds them, verifies them and
          joins them automatically.
          EOF
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false --latest=false --title "$TITLE" --notes-file assets/README.txt
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
