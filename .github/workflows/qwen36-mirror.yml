name: Mirror Qwen3.6-35B-A3B

on:
  push:
    branches: [claude/local-agent]
    paths: ['.github/workflows/qwen36-mirror.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qwen36-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: qwen3.6-35b-a3b-q4-k-m
      MODEL: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      HF_REPO: unsloth/Qwen3.6-35B-A3B-GGUF
      HF_REV: a483e9e6cbd595906af30beda3187c2663a1118c
      MODEL_SIZE: '22134528992'
      MODEL_SHA256: ac0e2c1189e055faa36eff361580e79c5bd6f8e76bffb4ce547f167d53e31a61
      PART_SIZE: '1900000000'
    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - name: Download pinned model in parts and verify
        shell: bash
        run: |
          set -euo pipefail
          url="https://huggingface.co/$HF_REPO/resolve/$HF_REV/$MODEL"
          mkdir -p parts assets
          count=$(( (MODEL_SIZE + PART_SIZE - 1) / PART_SIZE ))
          for i in $(seq 1 "$count"); do
            start=$(( (i - 1) * PART_SIZE ))
            end=$(( i * PART_SIZE - 1 ))
            if [ "$end" -ge "$MODEL_SIZE" ]; then end=$(( MODEL_SIZE - 1 )); fi
            want=$(( end - start + 1 ))
            file=$(printf 'parts/%s.part%03d' "$MODEL" "$i")
            for attempt in 1 2 3 4 5; do
              if curl --fail --location --silent --show-error --connect-timeout 30 --retry 3 --retry-all-errors \
                   --range "$start-$end" --output "$file" "$url" && [ "$(stat -c %s "$file")" -eq "$want" ]; then
                break
              fi
              echo "Part $i attempt $attempt failed; retrying."
              sleep 15
            done
            test "$(stat -c %s "$file")" -eq "$want"
            echo "Part $i of $count: $want bytes"
          done
          actual=$(cat parts/* | sha256sum | cut -d' ' -f1)
          echo "SHA-256 of joined parts: $actual"
          test "$actual" = "$MODEL_SHA256"
          (cd parts && sha256sum ./* | sed 's#  \./#  #' > ../assets/PARTS-SHA256SUMS.txt)
          printf '%s  %s\n' "$MODEL_SHA256" "$MODEL" > assets/MODEL-SHA256SUM.txt
          curl --fail --location --silent --show-error "https://huggingface.co/$HF_REPO/resolve/$HF_REV/README.md" -o assets/UPSTREAM-MODEL-CARD.md
          curl --fail --location --silent --show-error https://www.apache.org/licenses/LICENSE-2.0.txt -o assets/LICENSE-APACHE-2.0.txt
          cat assets/PARTS-SHA256SUMS.txt
          cat > assets/README.txt <<EOF
          Qwen3.6-35B-A3B, UD-Q4_K_M quantization (Unsloth GGUF)

          Official Qwen model (mixture of experts: 35B parameters, about 3B active
          per token), quantized by Unsloth. License: Apache-2.0 (attached).
          Source: https://huggingface.co/$HF_REPO
          Revision: $HF_REV
          Weights mirrored without modification; split for transport.

          Original file: $MODEL
          Original bytes: $MODEL_SIZE
          SHA256: $MODEL_SHA256

          Download ALL $count .part files. They are raw byte chunks, not loadable
          on their own. The local agent's start.py finds them in Downloads,
          verifies and joins them automatically.

          Needs about 24 GB of RAM to run (32 GB or more recommended) and about
          25 GB of free disk space while joining.
          EOF
          df -h .

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo "Published release exists; not replacing it."; exit 1; }
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --latest=false \
              --title "Qwen3.6-35B-A3B Q4_K_M (CPU, 32 GB+ RAM)" --notes-file assets/README.txt
          fi
          gh release upload "$TAG" assets/* parts/* --clobber
          gh release edit "$TAG" --draft=false --latest=false
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
