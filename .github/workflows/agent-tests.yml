name: Test local agent
on:
  push:
    paths: ['agent/**', '.github/workflows/agent-tests.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s agent/tests -v
